name: Release

# Pushing a tag like v0.2.0 builds the Windows installer and portable exe
# and attaches them to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --publish never

      # The apps show everything above the <!-- downloads --> marker as the change log
      - name: Build release notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## (.+?)\s*$') {
              if ($inSection) { break }
              $inSection = ($Matches[1] -eq $version)
              continue
            }
            if ($inSection) { $notes += $line }
          }
          if (-not ($notes -join '').Trim()) { $notes = @("See the [change log](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).") }
          $text = ($notes -join "`n").Trim() + "`n`n<!-- downloads -->`n" + (Get-Content .github/release-downloads.md -Raw)
          Set-Content -Path release-notes.md -Value $text -Encoding utf8

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release/*.exe

  # Runs after the release exists so both jobs never try to create it at once
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # "tools" was removed from the SDK repository and makes this action fail
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Check the tag matches the app version
        run: |
          name=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          if [ "v$name" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match versionName $name in android/app/build.gradle"
            exit 1
          fi

      # Without the signing secrets the APK is signed with a throwaway debug key and cannot update older installs
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No Android signing key configured; the APK is signed with a debug key"
          fi
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk "../KnackeredTV-Android-${GITHUB_REF_NAME#v}.apk"

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: KnackeredTV-Android-*.apk